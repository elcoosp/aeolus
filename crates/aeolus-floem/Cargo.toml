[package]
name = "aeolus-floem"
description = "Aeolus backend: lower Tailwind v4 StylePlans into Floem programmatic styles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.96"
# Not publishable in v0.1.0: depends on a git-pinned Floem commit (crates.io
# rejects git dependencies) and, in this sandbox, on the local `muda-stub`
# patch (floem hard-requires muda's `gtk` feature on Linux with no feature
# gate to turn it off). See reports/09-publishing/PUBLISHING.md.
publish = false

[dependencies]
aeolus-core = { path = "../aeolus-core" }
floem = { git = "https://github.com/lapce/floem", rev = "1351ffb162faeb8be983f1301d718a0d5fb59c27" }
smallvec = "1"
tracing = "0.1"

[dev-dependencies]
# Pinned to the exact taffy version Floem 0.2 uses so the Length::Pt →
# taffy `Dimension::length` pass-through is testable end-to-end.
taffy = { version = "0.9.2", features = ["grid"] }

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
