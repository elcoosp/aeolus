[package]
name = "aeolus-macro"
description = "Compile-time Tailwind v4 macros (tw!, cn!, theme!) - syn-free; expands the V1 pipeline's static Program, not the input string"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# The V1 macros compile through the git-only pipeline (aeolus-compile /
# aeolus-theme), so the crate follows the pipeline's publish discipline
# until the P3 surface publishes as a set.
publish = false

[lib]
proc-macro = true

[dependencies]
# The zero-dep core lexer is still what `extract_*` avoids copying, but
# the compile walk itself is the V1 pipeline (`compile_theme` +
# `keyword_texts`) — the macro is a thin shell over it (plan §3.2).
aeolus-core = { workspace = true }
aeolus-ir = { workspace = true }
aeolus-compile = { path = "../aeolus-compile" }
aeolus-theme = { workspace = true }
aeolus-codegen-gpui = { path = "../aeolus-codegen-gpui" }

[features]
verbose-diagnostics = []

# The macro grammar's pedantic exceptions ride the WORKSPACE table
# (cargo forbids a local `[lints.clippy]` beside `workspace = true`,
# and the source-level allow-attribute block it used to carry predates
# the workspace convention) — see the root manifest's `[lints.clippy]`.
[lints]
workspace = true
