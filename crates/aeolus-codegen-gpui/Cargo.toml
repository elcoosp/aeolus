[package]
name = "aeolus-codegen-gpui"
description = "Aeolus V1 GPUI codegen target: the capability table and the static-program token emitter the tw! macro consumes (docs/AEOLUS_V1_ARCHITECTURE.md §3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
aeolus-ir = { workspace = true }
aeolus-codegen = { path = "../aeolus-codegen" }
aeolus-compile = { path = "../aeolus-compile" }
aeolus-theme = { workspace = true }
proc-macro2 = "1"
quote = "1"

[lints]
workspace = true

# The capability gate's microbenchmarks (the per-expansion cost the
# macro surface's audit walk adds).
[dev-dependencies]
divan = "0.1"

[[bench]]
name = "gate"
harness = false
