[package]
name = "xtask"
description = "Aeolus V1 generator driver: walks aeolus-data's GeneratedArtifact seam to regenerate (gen-tables) and drift-verify (verify-tables) the committed artifacts (plan §3.2's generator story)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# The driver is workspace tooling: it never publishes (the rows it
# generates from live in aeolus-data, a git-only crate).
publish = false

[dependencies]
# The seam this drives — the artifact trait and list live in the
# library (the driver is a thin, test-pinned CLI over them, the
# aeolus-cli precedent: the whole program is `run(args, out, err)`).
aeolus-data = { path = "../aeolus-data" }

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
