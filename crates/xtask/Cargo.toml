[package]
name = "xtask"
description = "Aeolus V1 generator driver: walks aeolus-data's GeneratedArtifact seam to regenerate (gen-tables) and drift-verify (verify-tables) the committed artifacts, the §3.7 capability table's gen-gpui-caps / verify-gpui-caps pair and the docs book's gen-book / verify-book gate (plan §3.2, §3.7 and §8's generator story)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# The driver is workspace tooling: it never publishes (the rows it
# generates from live in aeolus-data, a git-only crate).
publish = false

[dependencies]
# The seam this drives — the artifact trait and list live in the
# library (the driver is a thin, test-pinned CLI over them, the
# aeolus-cli precedent: the whole program is `run(args, out, err)`).
aeolus-data = { path = "../aeolus-data" }
# The docs book's generated chapter (plan §8's P5 row, the "docs book"
# deliverable): the CLI reference renders from the CLI crate's own
# `USAGE` — the page is the binary's help text, never a parallel claim.
aeolus-cli = { path = "../aeolus-cli" }
# The §5.1 conformance score's seam and its GPUI impl (the
# `conformance-docs` artifact's render inputs): the trait + report live
# in aeolus-codegen, the capability impl rides the codegen-gpui crate's
# own supports/polyfilled tables, so the committed page is the
# emitter's verdicts, never a parallel claim.
aeolus-codegen = { path = "../aeolus-codegen" }
aeolus-codegen-gpui = { path = "../aeolus-codegen-gpui" }
# The IR longhand list the `gpui-caps` artifact walks (the §3.7
# generator slice's per-longhand rows ride `Prop::ALL`'s own order).
aeolus-ir = { workspace = true }
# The M1 scale-up's corpus-at-scale score (the conformance pages'
# second line): the committed golden corpus compiles through the V1
# pipeline (aeolus-compile + the two baked token tables — the default
# palette/theme CSS lives in aeolus-core's data) and each entry's
# longhands ride the same Capability verdicts the ceiling score runs.
aeolus-compile = { path = "../aeolus-compile" }
aeolus-theme = { workspace = true }
aeolus-core = { workspace = true }
# The five interpreter backends' walk-verdict replays (the
# `backend-caps` artifact's render inputs — the committed
# `caps_tables.rs` rows ARE the backends' own `walk_capabilities()`
# freezes, the conformance moat's publish-the-emitter's-verdicts rule).
aeolus-xilem = { path = "../aeolus-xilem" }
aeolus-floem = { path = "../aeolus-floem" }
aeolus-iced = { path = "../aeolus-iced" }
aeolus-egui = { path = "../aeolus-egui" }
aeolus-slint = { path = "../aeolus-slint" }

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
