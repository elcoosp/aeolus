[package]
name = "aeolus-xilem"
description = "Aeolus backend: lower Tailwind v4 StylePlans into Masonry property stacks and Xilem views"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.96"
# Not publishable in v0.1.0: depends on git-pinned Masonry/Xilem commits
# (crates.io rejects git dependencies) and, in this sandbox, on the local
# `muda-stub` patch. See reports/09-publishing/PUBLISHING.md.
publish = false

[dependencies]
aeolus-core = { path = "../aeolus-core" }
aeolus-rt = { path = "../aeolus-rt" }
masonry = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }
tracing = "0.1"

[dev-dependencies]
# The V1 compile seam builds the static programs the program lane walks,
# and the plan bridge feeds the differential pins.
aeolus-compile = { path = "../aeolus-compile" }
aeolus-theme = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
