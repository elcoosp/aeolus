[package]
name = "aeolus-rt"
description = "Aeolus V1 runtime: the static Program form, the Env probe and the themed interpreter re-exports a host backend consumes (docs/AEOLUS_V1_ARCHITECTURE.md §3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# Git-only until the P3 backend surface settles (plan §3.2/§7).
publish = false

[dependencies]
aeolus-ir = { workspace = true }
# The interpreter, Env, TokenSource and DynCache re-exports: the runtime
# crate is the HOST-facing seam over the pipeline, not a second compiler.
aeolus-compile = { path = "../aeolus-compile" }
aeolus-theme = { workspace = true }
# The style face's return type: the `StaticProgram::style*` methods
# answer the v0.x `ResolvedStyle` the legacy backends resolve, and the
# host names it from THIS crate's re-export (the walk entries' own
# shape, not a second style type).
aeolus-core = { workspace = true }
# The conformance probe corpus (plan §5.1's walk half): the registry's
# own rows are the probe grammar — one frozen program per row, the row's
# target longhands riding beside it.
aeolus-data = { path = "../aeolus-data" }

[dev-dependencies]
# The dynamic lane's microbenchmarks (divan, stable — the workspace
# bench idiom).
divan = "0.1"

[[bench]]
name = "class_cell"
harness = false

# The style face's benchmarks (the `StaticProgram::style*` methods, the
# free entries' delegates): the element walk and the pseudo-target
# cascade through the host surface, beside the free functions they
# thread.
[[bench]]
name = "style_face"
harness = false

[lints]
workspace = true
