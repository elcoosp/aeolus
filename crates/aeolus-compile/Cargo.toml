[package]
name = "aeolus-compile"
description = "Aeolus V1 compile seam: class strings through the lexer, the registry and the value pass into cascade-sorted longhand Programs, with typed spanned diagnostics and the Target emit arms (CSS text, rust tokens, interpreter, static data, and the arbitrary-value unit grammar)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# Git-only while the V1 pipeline assembles (plan §3.2) — like
# aeolus-syntax/aeolus-data/aeolus-ir, publish = false until the P2
# pipeline completes; the backends re-target onto `Program` (§7) before
# anything here publishes.
publish = false

[dependencies]
# The three P1 crates, consumed as the plan §3.2 table says: the lexer
# segments and spans, the registry interprets the body, the IR carries
# the result. aeolus-ir rides the workspace pin (the published-trio
# lockstep contract, root Cargo.toml); aeolus-syntax/aeolus-data are
# path-only (git-only leaves — no version requirement to keep in
# lockstep until the pipeline publishes).
aeolus-syntax = { path = "../aeolus-syntax" }
aeolus-data = { path = "../aeolus-data" }
aeolus-ir = { workspace = true }
# The theme pass (P2 slice 2, plan §3.4): the tiered TokenTable
# `compile_theme` lowers colour tokens and opacity modifiers through.
# It rides the workspace pin like aeolus-ir (it depends on aeolus-core,
# a published crate, so it joins the lockstep contract).
aeolus-theme = { workspace = true }
# The arbitrary-value unit grammar parses COLOUR values through the
# audited `aeolus_core::Color` (the same parser the v0.x oracle and the
# fuzzer exercise) and bakes `/opacity` modifiers through the audited
# `mix_with_transparent` premultiplied identity — the theme pass already
# pulls aeolus-core in, so the workspace pin adds no new graph edge.
aeolus-core = { workspace = true }
# `tracing` feature: spans on the pipeline stages (the same opt-in
# instrumentation seam the CLI grew in v0.9.1 and the registry in P1).
# OFF by default so the default graph stays dependency-light
# (aeolus-syntax + aeolus-data + aeolus-ir + aeolus-theme, each of
# which is itself dependency-light); no subscriber is
# installed here — the host app owns one.
tracing = { version = "0.1", optional = true }
# `miette` feature: the structured `Diagnostic` impl (code + help) on
# `CompileError`, beside the always-on `code()`/`help()` strings on
# `DiagnosticKind`. OFF by default; miette's fancy rendering is the
# host's choice.
miette = { version = "7", optional = true, default-features = false }

[features]
default = []
tracing = ["dep:tracing"]
miette = ["dep:miette"]

[dev-dependencies]
# The compile-seam microbenchmarks (divan, stable — the workspace bench
# idiom). The tests need nothing beyond the crate itself: the tables
# they pin against are the crate's own public dependencies.
divan = "0.1"

[[bench]]
name = "compile"
harness = false

# The CSS emit arm's benchmarks (the Target half's first artifact form).
[[bench]]
name = "css"
harness = false

# The dyn-cache benchmarks (the leak-pool dedupe slice): the cold path
# (probe + pipeline + store) against the warm hit and the uncached
# free functions.
[[bench]]
name = "dyn_cache"
harness = false

# The interpreter-arm benchmarks (plan §3.1 emit (c)): the per-frame
# resolve of the SAME shadcn Button program under resting and busy envs,
# baked and runtime tiers.
[[bench]]
name = "interp"
harness = false

# The static-data emit arm's benchmarks (plan §3.1 emit (b)): freezing
# the compiled program into the byte-stable static item, against the
# compile floor.
[[bench]]
name = "statics"
harness = false

# The rust-tokens emit arm's benchmarks (plan §3.1 emit (a)): the
# per-class fragment render over the same shadcn Button program the
# other arm benches key on, against the compile floor.
[[bench]]
name = "rust_tokens"
harness = false

# The arbitrary-value unit grammar's benchmarks (the value pass's last
# P2 slice): compiling arbitrary-valued utilities against the spacing
# scale's own floor.
[[bench]]
name = "arbitrary"
harness = false

# The attribute-probe fold's benchmarks (the variant surface's P2
# slice): the data-/aria-/has- fold against the state fold and the
# base compile floor.
[[bench]]
name = "attr_variants"
harness = false

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
