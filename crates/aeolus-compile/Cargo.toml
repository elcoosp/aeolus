[package]
name = "aeolus-compile"
description = "Aeolus V1 compile seam: class strings through the lexer, the registry and the value pass into cascade-sorted longhand Programs, with typed spanned diagnostics and the Target emit arms (CSS text, rust tokens, interpreter, static data, and the arbitrary-value unit grammar)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
# Git-only while the V1 pipeline assembles (plan §3.2) — like
# aeolus-syntax/aeolus-data/aeolus-ir, publish = false until the P2
# pipeline completes; the backends re-target onto `Program` (§7) before
# anything here publishes.
publish = false

[dependencies]
# The three P1 crates, consumed as the plan §3.2 table says: the lexer
# segments and spans, the registry interprets the body, the IR carries
# the result. aeolus-ir rides the workspace pin (the published-trio
# lockstep contract, root Cargo.toml); aeolus-syntax/aeolus-data are
# path-only (git-only leaves — no version requirement to keep in
# lockstep until the pipeline publishes).
aeolus-syntax = { path = "../aeolus-syntax" }
aeolus-data = { path = "../aeolus-data" }
aeolus-ir = { workspace = true }
# The theme pass (P2 slice 2, plan §3.4): the tiered TokenTable
# `compile_theme` lowers colour tokens and opacity modifiers through.
# It rides the workspace pin like aeolus-ir (it depends on aeolus-core,
# a published crate, so it joins the lockstep contract).
aeolus-theme = { workspace = true }
# The arbitrary-value unit grammar parses COLOUR values through the
# audited `aeolus_core::Color` (the same parser the v0.x oracle and the
# fuzzer exercise) and bakes `/opacity` modifiers through the audited
# `mix_with_transparent` premultiplied identity — the theme pass already
# pulls aeolus-core in, so the workspace pin adds no new graph edge.
aeolus-core = { workspace = true }
# `tracing` feature: spans on the pipeline stages (the same opt-in
# instrumentation seam the CLI grew in v0.9.1 and the registry in P1).
# OFF by default so the default graph stays dependency-light
# (aeolus-syntax + aeolus-data + aeolus-ir + aeolus-theme, each of
# which is itself dependency-light); no subscriber is
# installed here — the host app owns one.
tracing = { version = "0.1", optional = true }
# `miette` feature: the structured `Diagnostic` impl (code + help) on
# `CompileError`, beside the always-on `code()`/`help()` strings on
# `DiagnosticKind`. OFF by default; miette's fancy rendering is the
# host's choice.
miette = { version = "7", optional = true, default-features = false }

[features]
default = []
tracing = ["dep:tracing"]
miette = ["dep:miette"]

[dev-dependencies]
# The compile-seam microbenchmarks (divan, stable — the workspace bench
# idiom). The tests need nothing beyond the crate itself: the tables
# they pin against are the crate's own public dependencies.
divan = "0.1"

[[bench]]
name = "compile"
harness = false

# The composite grammar's benchmarks (the value pass's verbatim slot):
# the kind-gated compile walk beside the floor, the verbatim CSS rule
# text and the composite-mixed interp.
[[bench]]
name = "composites"
harness = false

# The grid auto-flow family's benchmarks (the §3.7 grid row's auto-flow
# half): the keyword walk beside the floor, the value-form CSS emit and
# the flow-mixed interp.
[[bench]]
name = "grid_flow"
harness = false

# The wider v4 hint table's benchmarks (the value pass's hint line):
# the hinted battery beside the floor, the unit-form CSS emit and the
# hint-mixed interp.
[[bench]]
name = "hints"
harness = false

# The CSS emit arm's benchmarks (the Target half's first artifact form).
[[bench]]
name = "css"
harness = false

# The custom-authoring CSS-file form's benchmarks (plan §5.4's "same
# file as web" line): the registration walk (parse + the `@apply`
# compiles), the applied hit against the expanded built-ins, and the
# customs-aware annotation walk's empty-bag floor.
[[bench]]
name = "custom_css"
harness = false

# The dyn-cache benchmarks (the leak-pool dedupe slice): the cold path
# (probe + pipeline + store) against the warm hit and the uncached
# free functions.
[[bench]]
name = "dyn_cache"
harness = false

# The interpreter-arm benchmarks (plan §3.1 emit (c)): the per-frame
# resolve of the SAME shadcn Button program under resting and busy envs,
# baked and runtime tiers.
[[bench]]
name = "interp"
harness = false

# The descendant-probe seam's benchmarks (plan §3.5's has- row, the
# resolution half): the per-frame walk over the Button string's
# descendant layers with the fact table hit, and the sourceless walk's
# note path beside it.
[[bench]]
name = "descendants"
harness = false

# The supports-variant seam's benchmarks (the `supports-[…]` row, the
# resolution half): the per-frame walk over a supports-mixed program
# with the capability table hit, and the sourceless walk's note path
# beside it.
[[bench]]
name = "supports"
harness = false

# The preference families' benchmarks (the media-feature tier, the
# resolution half): the env-answer walk over a preference-mixed
# program, the fire path and the quiet-miss path beside it.
[[bench]]
name = "preferences"
harness = false

# The capability families' benchmarks (the media-feature tier's
# input/orientation half): the env-answer walk over a capability-mixed
# program, the fire path and the quiet-miss path beside it.
[[bench]]
name = "capabilities"
harness = false

# The named-container seam's benchmarks (plan §3.5's container row, the
# resolution half): the per-frame walk over a container-mixed program
# with the bounds table hit and quietly missed, themeless and themed.
[[bench]]
name = "container_bounds"
harness = false

# The pseudo-element render-target benchmarks (plan §3.5's variant-costs
# row, the resolution half): the scoped walk over a pseudo-mixed program,
# both targets and the themed form.
[[bench]]
name = "pseudo_targets"
harness = false

# The metamorphic seam's benchmarks (plan §5.3's differential line, the
# `compile ⇒ interpret ⇒ equals emit` target): the full three-walk check
# over the shadcn Button surface, themed and themeless, against the
# single-utility floor.
[[bench]]
name = "metamorphic"
harness = false

# The static-data emit arm's benchmarks (plan §3.1 emit (b)): freezing
# the compiled program into the byte-stable static item, against the
# compile floor.
[[bench]]
name = "statics"
harness = false

# The rust-tokens emit arm's benchmarks (plan §3.1 emit (a)): the
# per-class fragment render over the same shadcn Button program the
# other arm benches key on, against the compile floor.
[[bench]]
name = "rust_tokens"
harness = false

# The arbitrary-value unit grammar's benchmarks (the value pass's last
# P2 slice): compiling arbitrary-valued utilities against the spacing
# scale's own floor.
[[bench]]
name = "arbitrary"
harness = false

# The attribute-probe fold's benchmarks (the variant surface's P2
# slice): the data-/aria-/has- fold against the state fold and the
# base compile floor.
[[bench]]
name = "attr_variants"
harness = false

# The plan-lowering arm's benchmarks (the §7 migration seam): the v0.x
# StylePlan write over the shadcn Button core, the theme-less boundary
# path and the single-utility floor.
[[bench]]
name = "plan_bridge"
harness = false

# The shadow tier's benchmarks (the §3.7 shadow row, the §7 seam): the
# preset resolution through the oracle's own theme reader, the recolour
# compose and the differential pair's walks.
[[bench]]
name = "shadow"
harness = false

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true

# The class-sort seam's benchmarks (plan §5.5's tooling-parity slice):
# the registry-order walk over the shadcn Button surface and the honest
# tail, against the single-utility floor.
[[bench]]
name = "sort"
harness = false

# The project-build seam's benchmarks (§2's approach C / the P6 row's
# `cargo aeolus build`): the extraction walk, the themed global
# artifact over the synthetic multi-file project, the themeless floor.
[[bench]]
name = "build"
harness = false

# The IR-level overlay seam's benchmarks (§3.6's surface (2)
# non-compile-time path): the base ⊕ override composition over the
# shadcn Button surface, the frozen⊕runtime shape, and the `cn` fold
# that delegate-walks the same seam.
[[bench]]
name = "overlay"
harness = false

# The motion layer's benchmarks (the plan P6 row): the compile of the
# motion families against the Button floor, and the interp of the
# motion-mixed program, themeless and themed.
[[bench]]
name = "motion"
harness = false

# The structural seam's benchmarks (the plan §3.5 probe row): the
# interp of the structural-mixed program, themeless (hit and
# unknown-facts miss) and themed.
[[bench]]
name = "struct"
harness = false

# The filter layer's benchmarks (the plan §3.7 backlog row's pipeline
# half): the compile of the filter families against the Button floor,
# the CSS emit of the var-chain form and the interp of the
# filter-mixed program.
[[bench]]
name = "filters"
harness = false

# The decoration family's benchmarks (the §3.7 typography surface's
# decoration half): the compile of the three-row root's sibling walk
# against the Button floor, the CSS emit of the four property forms,
# and the cached-loop warm path.
[[bench]]
name = "decoration"
harness = false

# The backdrop-filter layer's benchmarks (the plan §3.7 backlog row's
# second half): the compile of the backdrop families against the Button
# floor, the CSS emit of the prefixed var-chain form and the interp of
# the backdrop-mixed program.
[[bench]]
name = "backdrop_filters"
harness = false

[[bench]]
name = "suggest"
harness = false
