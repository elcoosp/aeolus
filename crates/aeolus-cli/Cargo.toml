[package]
name = "aeolus-cli"
description = "Headless Aeolus CLI: resolve Tailwind v4 class strings into plan snapshots, verification CSS, lane-aware diffs and lint findings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
# Hand-rolled arg parsing, std I/O only: no EXTERNAL crates in any
# build (the CLI shares the core's no-external-crate discipline). The
# two aeolus crates below are workspace members, each itself
# dependency-light. The two OPTIONAL features further down are
# instrumentation seams (v0.9.1 consumer-handoff): they stay OFF by
# default so the default dependency graph pulls nothing extra.
aeolus-core = { workspace = true }
# The V1 pipeline join (plan §3.2's CLI row — "reuses aeolus-compile
# as-is", plan §5.5's `explain` line): the per-class Rust fragments the
# Target::Rust arm renders.
aeolus-compile = { path = "../aeolus-compile" }
# The IR types the `expand` render names (`Val`/`Prop`/`Cond`/`Program`):
# the interp arm's effective-declaration form the command renders.
aeolus-ir = { workspace = true }
# The CSS-first theme source `explain --theme` lowers colour tokens
# through (the tiered tables the theme pass resolves).
aeolus-theme = { workspace = true }
# `tracing` feature: debug spans around command dispatch and the per-file
# check loop (no subscriber installed by the CLI — the host app owns one).
# The flag FORWARDS down the pipeline (the consumer-handoff): the
# CLI drives the compile walk, so one flag instruments the WHOLE walk —
# aeolus-compile's events forward to aeolus-data and aeolus-theme in
# turn. The old shape left every pipeline event compiled out.
tracing = { version = "0.1", optional = true }
# `miette` feature: structured `Diagnostic` impls (code + help text) on
# the typed errors; `miette`'s fancy rendering is the host's choice.
# Forwards down the pipeline with `tracing` (see above).
miette = { version = "7", optional = true, default-features = false }

[features]
default = []
# One flag, the whole walk: the CLI's own spans AND the pipeline
# crates' events (compile forwards to data/theme in turn — the walk's
# registry reads and theme resolves instrument too).
tracing = ["dep:tracing", "aeolus-compile/tracing", "aeolus-theme/tracing"]
miette = ["dep:miette", "aeolus-compile/miette", "aeolus-theme/miette"]

[dev-dependencies]
divan = "0.1"

[[bin]]
name = "aeolus"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

# The explain command's benchmarks (the §5.5 tooling-parity slice): the
# themeless emit, the themed emit and the diagnostics path.
[[bench]]
name = "explain"
harness = false

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true

# The expand command's benchmarks (the interp arm's CLI form): the
# themeless effective walk, the themed walk, the keyword-heavy render.
[[bench]]
name = "expand"
harness = false

# The plan command's benchmarks (the §7 migration seam's consumer face):
# the themeless bridge, the themed bridge (the baked table's colour
# conversion) and the diagnostics path.
[[bench]]
name = "plan"
harness = false

# The fmt command's benchmarks (the class-sort seam's file face): the
# whole-file extraction+sort walk and the single-string sort at the
# Button slice's real shape.
[[bench]]
name = "fmt"
harness = false
