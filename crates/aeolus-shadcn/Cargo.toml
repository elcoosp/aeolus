[package]
name = "aeolus-shadcn"
description = "Shadcn/ui v4 class tables and thin Xilem/Floem wrappers for the Aeolus lowering stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.96"
# Not publishable in v0.1.0: depends on the two git-pinned backend crates
# (which themselves depend on git-pinned framework commits; crates.io rejects
# git dependencies). See reports/09-publishing/PUBLISHING.md.
publish = false

[dependencies]
aeolus-core = { path = "../aeolus-core" }
# The program tables' compile seam (plan §3.6's surface (2), the
# closed-world const-table row): the verbatim v4 strings compile
# through the V1 pipeline once per combo and intern.
aeolus-compile = { path = "../aeolus-compile" }
aeolus-rt = { path = "../aeolus-rt" }
aeolus-theme = { workspace = true }
aeolus-ir = { workspace = true }
aeolus-xilem = { path = "../aeolus-xilem" }
aeolus-floem = { path = "../aeolus-floem" }
aeolus-iced = { path = "../aeolus-iced" }
aeolus-egui = { path = "../aeolus-egui" }
aeolus-slint = { path = "../aeolus-slint" }
# Widget style types for the Iced wrappers (no renderer features — the
# aeolus-iced crate comment explains why this is the right dep).
iced_widget = { version = "0.14", default-features = false }
egui = "0.37"
masonry = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }
xilem_masonry = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }
floem = { git = "https://github.com/lapce/floem", rev = "1351ffb162faeb8be983f1301d718a0d5fb59c27" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "dc496876a2f6ff2ce7687bfc8c19bd311bb553dc" }
# The program tables' microbenchmark (divan, stable — the workspace
# bench idiom).
divan = "0.1"

# The F6 story's two arms side by side (the string path's per-call
# String build vs the program table's interned hit).
[[bench]]
name = "program"
harness = false

# Pedantic clippy, inherited from the workspace (v0.8 §4).
[lints]
workspace = true
