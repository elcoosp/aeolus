[package]
name = "aeolus-gpui"
description = "GPUI runtime for the Aeolus V1 static program: TwExt/TwStateExt apply a tw!-compiled StaticProgram through gpui's Styled/InteractiveElement surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
aeolus-ir = { workspace = true }
aeolus-rt = { path = "../aeolus-rt" }
aeolus-compile = { path = "../aeolus-compile" }
# The `tw!`/`cn!`/`theme!` macros the prelude re-exports.
aeolus-macro = { workspace = true }

[dev-dependencies]
# The attribute-bits seam's microbenchmarks (divan, stable — the
# workspace bench idiom).
divan = "0.1"
# The P0 perf-contract harness measures the v0.x lane BESIDE the static
# walk (the §4 table's two lanes on one harness): the plan cache's
# static/dynamic paths are the lane the static-program seam replaced.
aeolus-core = { workspace = true }

[[bench]]
name = "attrs"
harness = false

# The named-container bounds seam's microbenchmark (the §3.5 row's
# walk half): the walk applying a program with named `@container`
# layers, with and without the host's bounds in hand.
[[bench]]
name = "containers"
harness = false

# The element-bounds wrapper's microbenchmark (the §3.5 row's measuring
# half): the walk consuming the measured hand-off beside the built-in
# static table, and the converged publish the wrapper's every-frame
# prepaint runs.
[[bench]]
name = "container_query"
harness = false

# The motion lane's microbenchmark (the §3.7 row's GPUI half): the
# frozen-shorthand parse, the built `Animation` and the cascade winner
# walk the lane's entries run.
[[bench]]
name = "motion"
harness = false

# The ring polyfill's microbenchmark (the §3.7 tier): the walk applying
# a `tw!`-compiled ring program, and the accumulator's own composition.
[[bench]]
name = "ring"
harness = false

# The gradient lane's microbenchmark (the §3.7 native tier): the walk
# applying a `tw!`-compiled two-stop linear program, and the
# accumulator's own composition.
[[bench]]
name = "grad"
harness = false

# The `variants!` compound-variant dispatch's microbenchmark: the
# generated `style()` match over the cartesian combos.
[[bench]]
name = "variants"
harness = false

# The `variants!` slot dispatch's microbenchmark: the generated
# `style_slot()` match over the slot × combo cartesian.
[[bench]]
name = "slots"
harness = false

# The grid-placement + flex-basis tier's microbenchmark (the §3.7 grid
# row's finished native subset): the line placements, the span-pair
# compose and the basis family's value shapes through the walk.
[[bench]]
name = "placement"
harness = false

# The shadow tier's microbenchmark (the §3.7 shadow row's native tier):
# the walk applying a `tw!`-compiled shadow program (the preset bands
# composed beside the ring's), and the accumulator's own composition.
[[bench]]
name = "shadow"
harness = false

# The filter tier's polyfill-half microbenchmark (the §3.7 filter row's
# landed half): the walk applying a cell-compiled matrix-chain program,
# the drop-shadow band parse beside the shadow tier's, the empty-chain
# identity, and the accumulator's own shade.
[[bench]]
name = "filters"
harness = false

# The decoration tier's microbenchmark (the §3.7 typography surface's
# decoration half): the walk applying a `tw!`-compiled decoration
# program (the colour/thickness/style longhands), the integer-thickness
# two-leg patch, and the line-only floor.
[[bench]]
name = "decoration"
harness = false

# The P0 performance-contract harness (the §4 row's "real numbers
# replace §4 targets"): the static walk beside the hand-written chains,
# the clone pattern, the v0.x lane's static/dynamic paths and the
# ClassCell's warm/cold shapes — five representative strings, the
# parity pins at setup.
[[bench]]
name = "perf_contract"
harness = false

[lints]
workspace = true
