[package]
name = "aeolus-gpui"
description = "GPUI runtime for the Aeolus V1 static program: TwExt/TwStateExt apply a tw!-compiled StaticProgram through gpui's Styled/InteractiveElement surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
aeolus-ir = { workspace = true }
aeolus-rt = { path = "../aeolus-rt" }
aeolus-compile = { path = "../aeolus-compile" }
# The `tw!`/`cn!`/`theme!` macros the prelude re-exports.
aeolus-macro = { workspace = true }

[dev-dependencies]
# The attribute-bits seam's microbenchmarks (divan, stable — the
# workspace bench idiom).
divan = "0.1"

[[bench]]
name = "attrs"
harness = false

# The named-container bounds seam's microbenchmark (the §3.5 row's
# walk half): the walk applying a program with named `@container`
# layers, with and without the host's bounds in hand.
[[bench]]
name = "containers"
harness = false

# The element-bounds wrapper's microbenchmark (the §3.5 row's measuring
# half): the walk consuming the measured hand-off beside the built-in
# static table, and the converged publish the wrapper's every-frame
# prepaint runs.
[[bench]]
name = "container_query"
harness = false

# The motion lane's microbenchmark (the §3.7 row's GPUI half): the
# frozen-shorthand parse, the built `Animation` and the cascade winner
# walk the lane's entries run.
[[bench]]
name = "motion"
harness = false

# The ring polyfill's microbenchmark (the §3.7 tier): the walk applying
# a `tw!`-compiled ring program, and the accumulator's own composition.
[[bench]]
name = "ring"
harness = false

# The gradient lane's microbenchmark (the §3.7 native tier): the walk
# applying a `tw!`-compiled two-stop linear program, and the
# accumulator's own composition.
[[bench]]
name = "grad"
harness = false

# The `variants!` compound-variant dispatch's microbenchmark: the
# generated `style()` match over the cartesian combos.
[[bench]]
name = "variants"
harness = false

# The `variants!` slot dispatch's microbenchmark: the generated
# `style_slot()` match over the slot × combo cartesian.
[[bench]]
name = "slots"
harness = false

[lints]
workspace = true
