[workspace]
resolver = "2"
members = [
    "crates/aeolus-core",
    "crates/aeolus-macro",
    "crates/aeolus-cli",
    "crates/aeolus-shadcn",
    "crates/aeolus-xilem",
    "crates/aeolus-floem",
    "crates/aeolus-iced",
    "crates/aeolus-egui",
    "crates/aeolus-slint",
]
# cargo-fuzz's own workspace lives here; it must not join this one.
exclude = ["fuzz"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aeolus-rs/aeolus"

[workspace.dependencies]
aeolus-core = { version = "0.7.0", path = "crates/aeolus-core" }
aeolus-macro = { version = "0.7.0", path = "crates/aeolus-macro" }

# AEOLUS sandbox only: floem hard-depends on muda's `gtk` feature on Linux
# (floem/Cargo.toml, `[target.'cfg(target_os = "linux")'.dependencies]` has no
# feature gate), which needs GTK3 dev headers (gdk-3.0.pc) that are not
# installed here and cannot be installed. This patch swaps in a no-op,
# API-compatible stub (crates/muda-stub) covering the exact muda surface
# floem uses. The stub is dev-only: it is NOT a workspace member, is never a
# dependency of any publishable crate (aeolus-core / aeolus-macro do not
# reference muda at all), and the three backend crates carry `publish = false`
# for exactly this reason. See reports/09-publishing/PUBLISHING.md.
[patch.crates-io]
muda = { path = "crates/muda-stub" }

[profile.release]
opt-level = 3
lto = "thin"

# Disk-constrained sandbox: strip DWARF in dev builds (tests don't need it).
[profile.dev]
debug = 0
debug-assertions = true
