[package]
name = "aeolus-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.aeolus-core]
path = "../crates/aeolus-core"

[[bin]]
name = "parse_class_string"
path = "fuzz_targets/parse_class_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "color_parse"
path = "fuzz_targets/color_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cn"
path = "fuzz_targets/cn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "theme_from_css"
path = "fuzz_targets/theme_from_css.rs"
test = false
doc = false
bench = false

# Hide the fuzz workspace from IDEs and keep it out of the root workspace.
[workspace]

[[bin]]
name = "parse_variant"
path = "fuzz_targets/parse_variant.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_eval"
path = "fuzz_targets/probe_eval.rs"
test = false
doc = false
bench = false
